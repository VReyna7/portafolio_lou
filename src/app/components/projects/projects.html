<section id="proyectos" class="section" appReveal=".eyebrow, .section__title, .section__lead, .card">
  <p class="eyebrow">Trabajo realizado</p>
  <h2 class="section__title">Proyectos</h2>
  <p class="section__lead">
    Casos donde muestro el proceso: la investigación, las herramientas y el resultado.
  </p>

  <div class="gallery">
    @for (project of projects(); track project.slug; let i = $index) {
      <button
        type="button"
        class="card"
        [style.--accent]="project.accent"
        (click)="open(project)"
      >
        @if (project.cover) {
          <span class="card__cover">
            <img [src]="project.cover" [alt]="project.title" loading="lazy" />
          </span>
        }
        <span class="card__body">
          <span class="card__number">{{ number(i) }}</span>
          <span class="card__category">{{ project.category }}</span>
          <span class="card__title">{{ project.title }}</span>
          <span class="card__summary">{{ project.summary }}</span>
          <span class="card__cta">Ver proyecto <span aria-hidden="true">→</span></span>
        </span>
      </button>
    }
  </div>
</section>

<app-project-detail />
