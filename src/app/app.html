@if (content(); as site) {
  <header class="topbar">
    <a class="topbar__brand" href="#inicio">{{ site.profile.name }}</a>
    <nav class="topbar__nav" aria-label="Secciones">
      <a href="#inicio">Inicio</a>
      <a href="#herramientas">Herramientas</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#contacto" class="topbar__cta">Contacto</a>
    </nav>
  </header>

  <main class="page">
    <app-hero [profile]="site.profile" />
    <app-tools [tools]="site.tools" />
    <app-projects [projects]="site.projects" />
    <app-contact [contact]="site.contact" />
  </main>

  <footer class="footer">© {{ year }} {{ site.profile.name }}</footer>
} @else {
  <div class="loading" aria-busy="true">Cargando portafolio...</div>
}
